<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrain Coverage Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--bg:#1d2420;--panel:#262e29;--line:#3a453e;--ink:#e8ece6;--mute:#9aa89d;--trp:#ffd23f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;font:14px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
#side{width:480px;max-width:52vw;overflow-y:auto;padding:14px;background:var(--panel);border-right:1px solid var(--line)}
#mapwrap{flex:1;min-width:0;position:relative}
#map,#v3{position:absolute;inset:0}
#map{z-index:0}
#v3{display:none;z-index:1;background:#10161a}
#tabs{position:absolute;top:10px;right:10px;z-index:1200;display:flex;gap:4px}
#tabs button{width:auto;padding:6px 12px;background:#fff;color:#222;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
#tabs button.on{background:var(--trp)}
#hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:#cfd8d2;background:rgba(0,0,0,.55);padding:4px 8px;border-radius:4px}
h1{font-size:18px;margin:0 0 10px}
h2{font-size:13px;margin:14px 0 6px;color:var(--mute);font-weight:600}
input{width:100%;padding:6px 7px;margin:2px 0 6px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--trp);outline-offset:1px}
label{font-size:12px;color:var(--mute)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.cols>div>h2{margin-top:0;color:var(--ink)}
.card{padding:8px;margin-bottom:8px;border:1px solid var(--line);border-top-width:4px;border-radius:4px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:12px;color:var(--mute)}
button{width:100%;padding:10px;background:var(--trp);color:#222;border:0;border-radius:4px;font:600 14px inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.add{padding:6px;background:var(--line);color:var(--ink);font-weight:400;font-size:13px}
button.x{width:auto;padding:0 6px;background:none;color:var(--mute);font-size:14px}
#go{margin-top:12px}
#bar{height:6px;background:var(--bg);border-radius:3px;margin-top:8px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--trp)}
#msg{margin-top:8px;font-size:13px;white-space:pre-line}
#msg.err{color:#ff8a80}
@media(max-width:800px){body{flex-direction:column}#side{width:100%;max-width:none;max-height:55vh}}
</style>
</head>
<body>
<div id="side">
<h1>Terrain Coverage Planner</h1>

<h2>Map area: 4 corner coordinates (lat, lon)</h2>
<input id="c1" value="31.00, 77.00" aria-label="Corner 1">
<input id="c2" value="31.00, 77.40" aria-label="Corner 2">
<input id="c3" value="31.30, 77.40" aria-label="Corner 3">
<input id="c4" value="31.30, 77.00" aria-label="Corner 4">

<h2>Troop location (lat, lon)</h2>
<input id="troop" value="31.15, 77.20" aria-label="Troop">

<div class="cols">
  <div><h2>Radars (max 3)</h2><div id="list-r"></div><button class="add" id="add-r" type="button">+ Add radar</button></div>
  <div><h2>Weapons (max 3)</h2><div id="list-w"></div><button class="add" id="add-w" type="button">+ Add weapon</button></div>
</div>

<button id="go">Generate map</button>
<div id="bar"><i></i></div>
<div id="msg">Enter the details and press Generate map. Elevation data is fetched online.</div>
</div>
<div id="mapwrap"><div id="map"></div><div id="v3"><div id="hint">Drag: rotate · Scroll: zoom · Right-drag: pan · Lines show each ceiling</div></div><div id="tabs"><button id="t2" class="on">2D map</button><button id="t3">3D view</button></div></div>

<script>
const R = 6371000, KR = R * 4 / 3;      // earth radius, 4/3 effective radius for refraction
const NA = 72, NS = 20;                  // azimuth rays, samples per ray
const MAXU = 3;
const COL = {r: ['#3fa7ff', '#00d4c8', '#8e7dff'], w: ['#ff5a4d', '#ff9a3d', '#ff5fa8']};
const DEF = {r: {n: 'Radar', cl: 6000, rg: 20, h: 10, hl: 'Antenna height (m)', loc: '31.18, 77.15'},
             w: {n: 'Weapon', cl: 3000, rg: 10, h: 4, hl: 'Mount height (m)', loc: '31.12, 77.22'}};

const map = L.map('map').setView([31.15, 77.2], 10);
const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 19, attribution: '© OpenStreetMap'});
const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {maxZoom: 17, attribution: '© OpenTopoMap'});
topo.addTo(map);
let layer = L.layerGroup().addTo(map);
L.control.layers({'Terrain map': topo, 'Street map': osm}, {'Results': layer}).addTo(map);

const $ = id => document.getElementById(id);
const parse = (s, what) => { const p = s.split(/[,\s]+/).filter(Boolean).map(Number); if (p.length < 2 || p.some(isNaN)) throw new Error('Bad coordinate for ' + what + ': "' + s + '". Use: lat, lon'); return [p[0], p[1]]; };
const status = (t, err) => { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; };
const progress = f => $('bar').firstElementChild.style.width = (f * 100) + '%';

// ---- dynamic radar / weapon cards ----
function refresh() {
  for (const k of ['r', 'w']) {
    const cards = [...$('list-' + k).children];
    cards.forEach((c, i) => c.style.borderTopColor = COL[k][i]);
    $('add-' + k).disabled = cards.length >= MAXU;
  }
}
function addUnit(k, loc) {
  const box = $('list-' + k), n = box.children.length;
  if (n >= MAXU) return;
  const d = DEF[k], el = document.createElement('div');
  el.className = 'card'; el.dataset.k = k;
  el.innerHTML = `<div class="hd"><span>${d.n} ${n + 1}</span><button class="x" type="button" title="Remove">✕</button></div>
    <label>Name</label><input class="nm" value="${d.n}-${n + 1}">
    <label>Location (lat, lon)</label><input class="lc" value="${loc || ''}" placeholder="lat, lon">
    <label>Range (km)</label><input class="rg" type="number" min="0" value="${d.rg}">
    <label>Ceiling above ground (m)</label><input class="cl" type="number" min="1" value="${d.cl}">
    <label>${d.hl}</label><input class="ah" type="number" value="${d.h}">
    <label>Target height above ground (m)</label><input class="th" type="number" value="100">`;
  el.querySelector('.x').onclick = () => { el.remove(); refresh(); };
  box.appendChild(el); refresh();
}
$('add-r').onclick = () => addUnit('r');
$('add-w').onclick = () => addUnit('w');
addUnit('r', DEF.r.loc); addUnit('w', DEF.w.loc);

// ---- geometry and elevation ----
function dest(lat, lon, brg, d) {
  const p1 = lat * Math.PI / 180, l1 = lon * Math.PI / 180, t = brg * Math.PI / 180, g = d / R;
  const p2 = Math.asin(Math.sin(p1) * Math.cos(g) + Math.cos(p1) * Math.sin(g) * Math.cos(t));
  const l2 = l1 + Math.atan2(Math.sin(t) * Math.sin(g) * Math.cos(p1), Math.cos(g) - Math.sin(p1) * Math.sin(p2));
  return [p2 * 180 / Math.PI, ((l2 * 180 / Math.PI + 540) % 360) - 180];
}

const sleep = ms => new Promise(s => setTimeout(s, ms));
const providers = [
  {name: 'Open-Topo-Data', gap: 1300,
   url: c => 'https://api.opentopodata.org/v1/srtm30m?locations=' + c.map(p => p[0].toFixed(5) + ',' + p[1].toFixed(5)).join('|'),
   read: j => j.results.map(r => r.elevation)}
];
const cache = new Map();

async function batch(c) {
  const key = c.map(p => p[0].toFixed(5) + ',' + p[1].toFixed(5)).join('|');
  if (cache.has(key)) return cache.get(key);
  let lastErr = 'unknown';
  for (const p of providers) {
    for (let tryNo = 0; tryNo < 4; tryNo++) {
      try {
        const r = await fetch(p.url(c));
        if (r.ok) {
          const v = p.read(await r.json()).map(x => (x == null ? NaN : x));
          await sleep(p.gap); cache.set(key, v); return v;
        }
        lastErr = p.name + ' returned ' + r.status;
        if (r.status !== 429 && r.status < 500) break;
        status('Elevation service busy (' + p.name + '). Waiting and retrying...');
        await sleep(4000 * (tryNo + 1));
      } catch (e) { lastErr = p.name + ' unreachable'; await sleep(1500); }
    }
  }
  throw new Error('Elevation services refused the request (' + lastErr + '). Wait a minute and try again, or reduce the range.');
}

// ---- Main source: AWS Terrain Tiles (Terrarium PNG, height encoded in colour) ----
const TZ = 11, tileCache = new Map();
function loadTile(x, y) {
  const key = x + '/' + y;
  if (!tileCache.has(key)) tileCache.set(key, new Promise((res, rej) => {
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 256;
        const g = c.getContext('2d', {willReadFrequently: true}); g.drawImage(img, 0, 0);
        res(g.getImageData(0, 0, 256, 256).data);
      } catch (e) { tileCache.delete(key); rej(e); }
    };
    img.onerror = () => { tileCache.delete(key); rej(new Error('Terrain tile ' + key + ' failed to load')); };
    img.src = `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${TZ}/${x}/${y}.png`;
  }));
  return tileCache.get(key);
}
async function tileElevations(pts, onStep) {
  const n = 2 ** TZ, need = new Set();
  const pos = pts.map(p => {
    const lr = p[0] * Math.PI / 180;
    const fx = (p[1] + 180) / 360 * n, fy = (1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n;
    const tx = Math.floor(fx), ty = Math.floor(fy);
    need.add(tx + '/' + ty);
    return {tx, ty, px: Math.min(255, Math.floor((fx - tx) * 256)), py: Math.min(255, Math.floor((fy - ty) * 256))};
  });
  const keys = [...need]; let next = 0, done = 0;
  const worker = async () => {
    while (next < keys.length) { const [x, y] = keys[next++].split('/').map(Number); await loadTile(x, y); onStep(++done / keys.length); }
  };
  await Promise.all([1, 2, 3, 4, 5, 6].map(worker));
  return Promise.all(pos.map(async p => {
    const d = await loadTile(p.tx, p.ty), o = (p.py * 256 + p.px) * 4;
    return d[o] * 256 + d[o + 1] + d[o + 2] / 256 - 32768;
  }));
}
async function elevations(pts, onStep) {
  try {
    const v = await tileElevations(pts, onStep);
    if (v.some(x => !isFinite(x))) throw new Error('Invalid tile data');
    return v;
  } catch (e) {
    console.warn(e);
    status('Main elevation source unavailable. Switching to Open-Topo-Data (slower)...');
    return elevationsApi(pts, onStep);
  }
}

async function elevationsApi(pts, onStep) {
  const out = [];
  for (let i = 0; i < pts.length; i += 100) {
    out.push(...await batch(pts.slice(i, i + 100)));
    onStep(Math.min(i + 100, pts.length) / pts.length);
  }
  let last = 0;
  return out.map(v => { if (isNaN(v)) return last; last = v; return v; });
}

// For each bearing, walk outward and stop where terrain hides the target.
async function coverage(s, onStep) {
  const pts = [[s.lat, s.lon]], step = s.range * 1000 / NS;
  for (let a = 0; a < NA; a++) for (let k = 1; k <= NS; k++) pts.push(dest(s.lat, s.lon, a * 360 / NA, k * step));
  const e = await elevations(pts, onStep);
  const h0 = e[0] + s.ah, poly = [];
  for (let a = 0; a < NA; a++) {
    let maxAng = -Infinity, reach = 0, blocked = false;
    for (let k = 1; k <= NS; k++) {
      const d = k * step, g = e[1 + a * NS + k - 1], curve = d / (2 * KR);
      const ground = (g - h0) / d - curve, target = (g + s.th - h0) / d - curve;
      const dz = g + s.th - e[0];
      if (!blocked && target >= maxAng && Math.hypot(d, dz) <= s.range * 1000 && dz <= s.ceil) reach = d; else blocked = true;
      maxAng = Math.max(maxAng, ground);
    }
    poly.push(dest(s.lat, s.lon, a * 360 / NA, reach));
  }
  return {poly, ground: e[0], e, step};
}

function inside(pt, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [yi, xi] = poly[i], [yj, xj] = poly[j];
    if ((xi > pt[1]) !== (xj > pt[1]) && pt[0] < (yj - yi) * (pt[1] - xi) / (xj - xi) + yi) c = !c;
  }
  return c;
}

const dot = (c, t) => L.divIcon({className: '', iconSize: [16, 16], iconAnchor: [8, 8],
  html: `<div style="width:16px;height:16px;border-radius:${t};background:${c};border:2px solid #fff"></div>`});

const darken = (hex, f) => '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.substr(i, 2), 16) * f).toString(16).padStart(2, '0')).join('');
// Dark, larger blip: dark fill, white edge, colored ring and glow so it stands out on any map
const blip = (c, r) => L.divIcon({className: '', iconSize: [26, 26], iconAnchor: [13, 13],
  html: `<div style="width:26px;height:26px;border-radius:${r};background:${darken(c, 0.3)};border:3px solid #fff;box-shadow:0 0 0 3px ${c},0 0 10px 4px rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center"><div style="width:8px;height:8px;border-radius:${r};background:${c}"></div></div>`});

function readUnits() {
  const units = [];
  for (const k of ['r', 'w']) {
    [...$('list-' + k).children].forEach((c, i) => {
      const q = s => c.querySelector(s).value, name = q('.nm') || (DEF[k].n + ' ' + (i + 1));
      const [lat, lon] = parse(q('.lc'), name);
      const u = {name, lat, lon, range: +q('.rg'), ceil: +q('.cl'), ah: +q('.ah'), th: +q('.th'),
                 color: COL[k][i], shape: k === 'r' ? '50%' : '2px', kind: k === 'r' ? 'Radar' : 'Weapon'};
      if (!(u.range > 0)) throw new Error('Range for ' + name + ' must be greater than zero.');
      if (!(u.ceil > u.ah)) throw new Error('Ceiling for ' + name + ' must be higher than its antenna/mount height.');
      units.push(u);
    });
  }
  return units;
}

// ---- 3D view ----
let renderer, scene3, camera, controls, group3, raf;
// Built-in camera controls: drag = rotate, right-drag or Shift-drag = pan, wheel / pinch = zoom
function makeControls(cam, el) {
  const st = {theta: 0, phi: 1, r: 1000}, target = new THREE.Vector3(), ptr = new Map();
  el.style.touchAction = 'none';
  el.addEventListener('contextmenu', e => e.preventDefault());
  const api = {
    target,
    set(pos) { const v = pos.clone().sub(target); st.r = v.length(); st.phi = Math.acos(v.y / st.r); st.theta = Math.atan2(v.x, v.z); api.update(); },
    update() {
      st.phi = Math.max(0.05, Math.min(1.55, st.phi)); st.r = Math.max(200, Math.min(5e5, st.r));
      cam.position.set(target.x + st.r * Math.sin(st.phi) * Math.sin(st.theta), target.y + st.r * Math.cos(st.phi), target.z + st.r * Math.sin(st.phi) * Math.cos(st.theta));
      cam.lookAt(target);
    }
  };
  const pan = (dx, dy) => {
    const k = st.r * 0.0015, rx = Math.cos(st.theta), rz = -Math.sin(st.theta), fx = -Math.sin(st.theta), fz = -Math.cos(st.theta);
    target.x += -dx * k * rx + dy * k * fx; target.z += -dx * k * rz + dy * k * fz;
  };
  el.addEventListener('pointerdown', e => { ptr.set(e.pointerId, {x: e.clientX, y: e.clientY}); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointerup', e => ptr.delete(e.pointerId));
  el.addEventListener('pointercancel', e => ptr.delete(e.pointerId));
  el.addEventListener('pointermove', e => {
    const p = ptr.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (ptr.size === 2) {
      const o = [...ptr.entries()].find(([id]) => id !== e.pointerId)[1];
      const before = Math.hypot(p.x - o.x, p.y - o.y), after = Math.hypot(e.clientX - o.x, e.clientY - o.y);
      if (after > 0) st.r *= before / after;
    } else if (e.buttons & 2 || e.shiftKey) pan(dx, dy);
    else { st.theta -= dx * 0.005; st.phi -= dy * 0.005; }
    p.x = e.clientX; p.y = e.clientY;
  });
  el.addEventListener('wheel', e => { e.preventDefault(); st.r *= Math.exp(e.deltaY * 0.001); }, {passive: false});
  return api;
}

function init3D() {
  if (renderer) return;
  if (typeof THREE === 'undefined') throw new Error('3D library could not be loaded. Check that cdnjs.cloudflare.com is reachable, then reload the page.');
  renderer = new THREE.WebGLRenderer({antialias: true});
  $('v3').prepend(renderer.domElement);
  scene3 = new THREE.Scene(); scene3.background = new THREE.Color(0x10161a);
  camera = new THREE.PerspectiveCamera(50, 1, 100, 1e6);
  controls = makeControls(camera, renderer.domElement);
  scene3.add(new THREE.AmbientLight(0xffffff, 0.65));
  const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(-1, 2, 1); scene3.add(sun);
  new ResizeObserver(fit3D).observe($('v3'));
}
function fit3D() {
  const w = $('v3').clientWidth, h = $('v3').clientHeight;
  if (!renderer || !w || !h) return;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
function loop() { raf = requestAnimationFrame(loop); controls.update(); renderer.render(scene3, camera); }
function setView(v) {
  const is3 = v === '3d' && !!group3;
  $('v3').style.display = is3 ? 'block' : 'none';
  $('t3').classList.toggle('on', is3); $('t2').classList.toggle('on', !is3);
  cancelAnimationFrame(raf);
  if (is3) { fit3D(); loop(); } else map.invalidateSize();
}
$('t2').onclick = () => setView('2d');
$('t3').onclick = () => group3 ? setView('3d') : status('Press Generate map first. The 3D view is built from the result.');

function label(text, color, S) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(0,0,0,.65)'; x.fillRect(0, 0, 256, 64);
  x.fillStyle = color; x.font = 'bold 30px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, 128, 32);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(c), depthTest: false}));
  sp.scale.set(S * 0.14, S * 0.035, 1); return sp;
}

async function build3D(corners, units, troop, onStep) {
  init3D();
  const lats = corners.map(c => c[0]), lons = corners.map(c => c[1]);
  const la0 = Math.min(...lats), la1 = Math.max(...lats), lo0 = Math.min(...lons), lo1 = Math.max(...lons);
  const GX = 40, GY = 40, pts = [];
  for (let j = 0; j < GY; j++) for (let i = 0; i < GX; i++) pts.push([la1 - (la1 - la0) * j / (GY - 1), lo0 + (lo1 - lo0) * i / (GX - 1)]);
  const el = await elevations(pts, onStep);
  const minE = Math.min(...el), maxE = Math.max(...el);
  const cla = (la0 + la1) / 2, clo = (lo0 + lo1) / 2, kx = 111320 * Math.cos(cla * Math.PI / 180), kz = 110574;
  const S = Math.max((lo1 - lo0) * kx, (la1 - la0) * kz);
  const P = (lat, lon, alt) => new THREE.Vector3((lon - clo) * kx, alt - minE, -(lat - cla) * kz);

  if (group3) scene3.remove(group3);
  group3 = new THREE.Group();

  // terrain
  const pos = [], col = [], idx = [], c1 = new THREE.Color(0x2f6b34), c2 = new THREE.Color(0x9a8456), c3 = new THREE.Color(0xf2f2f2);
  pts.forEach((p, n) => {
    const v = P(p[0], p[1], el[n]); pos.push(v.x, v.y, v.z);
    const t = (el[n] - minE) / ((maxE - minE) || 1);
    const c = t < 0.5 ? c1.clone().lerp(c2, t * 2) : c2.clone().lerp(c3, (t - 0.5) * 2);
    col.push(c.r, c.g, c.b);
  });
  for (let j = 0; j < GY - 1; j++) for (let i = 0; i < GX - 1; i++) {
    const a = j * GX + i, b = a + 1, c = a + GX, d = c + 1; idx.push(a, c, b, b, c, d);
  }
  const tg = new THREE.BufferGeometry();
  tg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  tg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  tg.setIndex(idx); tg.computeVertexNormals();
  group3.add(new THREE.Mesh(tg, new THREE.MeshLambertMaterial({vertexColors: true, side: THREE.DoubleSide})));

  // domes: rays at many elevation angles, stopped by terrain, slant range or ceiling
  const NE = 16;
  for (const u of units) {
    const e = u.res.e, step = u.res.step, h0 = e[0] + u.ah, Lmax = u.range * 1000;
    const ter = (a, d) => {
      const f = Math.min(d / step, NS), k = Math.min(Math.floor(f), NS - 1);
      const v0 = k === 0 ? e[0] : e[a * NS + k], v1 = e[a * NS + k + 1];
      return v0 + (v1 - v0) * (f - k);
    };
    const dp = [];
    for (let a = 0; a < NA; a++) for (let j = 0; j <= NE; j++) {
      const eps = j / NE * Math.PI / 2, se = Math.sin(eps), ce = Math.cos(eps);
      const Lm = Math.min(Lmax, se > 1e-6 ? (u.ceil - u.ah) / se : Lmax);
      let L = 0;
      for (let m = 1; m <= 40; m++) {
        const Lt = Lm * m / 40, d = Lt * ce;
        if (h0 + Lt * se < ter(a, d) + d * d / (2 * KR)) break;
        L = Lt;
      }
      const q = dest(u.lat, u.lon, a * 360 / NA, L * ce), v = P(q[0], q[1], h0 + L * se);
      dp.push(v.x, v.y, v.z);
    }
    const di = [];
    for (let a = 0; a < NA; a++) for (let j = 0; j < NE; j++) {
      const a1 = (a + 1) % NA, i00 = a * (NE + 1) + j, i10 = a1 * (NE + 1) + j;
      di.push(i00, i10, i00 + 1, i00 + 1, i10, i10 + 1);
    }
    const dg = new THREE.BufferGeometry();
    dg.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3)); dg.setIndex(di);
    group3.add(new THREE.Mesh(dg, new THREE.MeshBasicMaterial({color: u.color, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false})));
    group3.add(new THREE.Mesh(dg, new THREE.MeshBasicMaterial({color: u.color, wireframe: true, transparent: true, opacity: 0.3})));

    // marker, ceiling line, label
    const base = P(u.lat, u.lon, h0), top = P(u.lat, u.lon, e[0] + u.ceil), r = S * 0.008;
    const mk = new THREE.Mesh(u.kind === 'Radar' ? new THREE.SphereGeometry(r, 16, 12) : new THREE.BoxGeometry(r * 1.6, r * 1.6, r * 1.6),
      new THREE.MeshBasicMaterial({color: darken(u.color, 0.55)}));
    mk.position.copy(base); group3.add(mk);
    group3.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([base, top]), new THREE.LineBasicMaterial({color: u.color})));
    const lb = label(u.name, u.color, S); lb.position.set(base.x, base.y + S * 0.04, base.z); group3.add(lb);
  }

  // troop on the terrain
  const ti = Math.max(0, Math.min(GX - 1, Math.round((troop[1] - lo0) / (lo1 - lo0) * (GX - 1))));
  const tj = Math.max(0, Math.min(GY - 1, Math.round((la1 - troop[0]) / (la1 - la0) * (GY - 1))));
  const tp = P(troop[0], troop[1], el[tj * GX + ti]), th = S * 0.03;
  const cone = new THREE.Mesh(new THREE.ConeGeometry(S * 0.008, th, 12), new THREE.MeshBasicMaterial({color: 0xffd23f}));
  cone.position.set(tp.x, tp.y + th / 2, tp.z); group3.add(cone);
  const tl = label('Troop', '#ffd23f', S); tl.position.set(tp.x, tp.y + th + S * 0.03, tp.z); group3.add(tl);

  scene3.add(group3);
  controls.target.set(0, 0, 0); controls.set(new THREE.Vector3(0, S * 0.7, S * 0.9));
}

$('go').onclick = async () => {
  const btn = $('go'); btn.disabled = true;
  try {
    const corners = ['c1', 'c2', 'c3', 'c4'].map((id, i) => parse($(id).value, 'corner ' + (i + 1)));
    const troop = parse($('troop').value, 'troop');
    const units = readUnits();
    if (!units.length) throw new Error('Add at least one radar or weapon.');

    layer.clearLayers();
    const area = L.polygon(corners, {color: '#fff', weight: 2, dashArray: '6 6', fill: false}).addTo(layer);
    map.fitBounds(area.getBounds().pad(0.1));

    const lines = [];
    for (let i = 0; i < units.length; i++) {
      const s = units[i];
      status('Fetching elevation for ' + s.name + ' (' + (i + 1) + ' of ' + units.length + ')...');
      const res = await coverage(s, f => progress((i + f) / (units.length + 1)));
      s.res = res;
      L.circle([s.lat, s.lon], {radius: s.range * 1000, color: s.color, weight: 1, dashArray: '4 6', fill: false}).addTo(layer);
      L.polygon(res.poly, {color: s.color, weight: 2, fillColor: s.color, fillOpacity: 0.2})
        .bindPopup(`${s.kind}: ${s.name}<br>Range ${s.range} km<br>Ground ${Math.round(res.ground)} m`).addTo(layer);
      L.marker([s.lat, s.lon], {icon: blip(s.color, s.shape), zIndexOffset: 1000})
        .bindTooltip(s.name, {permanent: true, direction: 'top', offset: [0, -14]})
        .bindPopup(`${s.kind}: ${s.name}<br>Ground ${Math.round(res.ground)} m`).addTo(layer);
      lines.push(`${s.name}: troop is ${inside(troop, res.poly) ? 'INSIDE' : 'OUTSIDE'} coverage.`);
    }
    L.marker(troop, {icon: dot('#ffd23f', '0')}).bindTooltip('Troop').addTo(layer);
    status('Fetching terrain for the 3D view...');
    let note3 = '';
    try { await build3D(corners, units, troop, f => progress((units.length + f) / (units.length + 1))); setView('3d'); }
    catch (e3) { console.error(e3); note3 = '\n3D view failed: ' + e3.message; setView('2d'); }
    progress(1);
    status('Done. Dashed circle = ideal range; filled shape = coverage after terrain masking.\n' + lines.join('\n') + note3);
  } catch (err) {
    status(err.message + (err instanceof TypeError ? ' Check your internet connection.' : ''), true);
  }
  btn.disabled = false;
};
</script>
